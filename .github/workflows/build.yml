name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run deterministic tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build portable app
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BackgroundFerry-win-x64
          path: artifacts/BackgroundFerry-win-x64.zip
