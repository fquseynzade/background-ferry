name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify and package
        shell: pwsh
        run: |
          ./scripts/test.ps1
          ./scripts/publish.ps1
          $hash = (Get-FileHash artifacts/BackgroundFerry-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BackgroundFerry-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME artifacts/BackgroundFerry-win-x64.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "Background Ferry $env:GITHUB_REF_NAME"
